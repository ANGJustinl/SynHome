# Demo configuration file for SynHome

# ZhipuAI API settings
zhipuai:
  enabled: true
  api_key: "your_api_key_here"  # Replace with actual API key
  model: "chatglm-turbo"
  base_url: "https://open.bigmodel.cn/api/paas/v4"

# Device configurations
devices:
  - id: "thermostat1"
    name: "客厅空调"
    type: "air_conditioner"
    capabilities:
      power:
        type: "switch"
        states: ["on", "off"]
      temperature:
        type: "number"
        unit: "celsius"
        min_value: 16
        max_value: 30
      mode:
        type: "enum"
        values: ["cool", "heat", "auto", "fan"]

  - id: "light1"
    name: "客厅主灯"
    type: "light"
    capabilities:
      power:
        type: "switch"
        states: ["on", "off"]
      brightness:
        type: "number"
        unit: "percent"
        min_value: 0
        max_value: 100
      color:
        type: "enum"
        values: ["white", "warm", "cool", "red", "green", "blue"]

  - id: "curtain1"
    name: "客厅窗帘"
    type: "curtain"
    capabilities:
      position:
        type: "number"
        unit: "percent"
        min_value: 0
        max_value: 100
      mode:
        type: "enum"
        values: ["manual", "automatic"]

# Adapter configurations
adapters:
  mqtt_adapter:
    type: "mqtt"
    host: "localhost"
    port: 1883
    username: ""
    password: ""

  http_adapter:
    type: "http"
    base_url: "http://localhost:8080"
    timeout: 30

# Physical device mappings
physical_devices:
  "mqtt:living_room_ac":
    virtual_device: "thermostat1"
    adapter: "mqtt_adapter"
    topic: "home/living_room/ac"

  "http:living_room_light":
    virtual_device: "light1"
    adapter: "http_adapter"
    endpoint: "/api/lights/living_room"